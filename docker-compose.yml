services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sgit
      POSTGRES_PASSWORD: sgit
      POSTGRES_DB: sgit
    ports:
      - "5437:5432"
    volumes:
      - sgit-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgit -d sgit"]
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "18000:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sgit
      MINIO_ROOT_PASSWORD: sgit-secreto
    ports:
      - "18001:9000"
      - "18002:9001"
    volumes:
      - sgit-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    command: ["sh", "docker/arranque-api.sh"]
    ports:
      - "18003:18003"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18003/salud').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    command: ["sh", "docker/arranque-web.sh"]
    ports:
      - "18004:18004"
    volumes:
      - .:/app
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sgit-pg:
  sgit-minio:
