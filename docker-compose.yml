services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sgit
      POSTGRES_PASSWORD: sgit
      POSTGRES_DB: sgit
    ports:
      - "5437:5432"
    volumes:
      - sgit-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgit -d sgit"]
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "18000:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sgit
      MINIO_ROOT_PASSWORD: sgit-secreto
    ports:
      - "18001:9000"
      - "18002:9001"
    volumes:
      - sgit-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  sgit-pg:
  sgit-minio:
